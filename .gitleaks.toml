title = "perkfit gitleaks config"

[extend]
useDefault = true

# Generic shape rule: an assignment to one of this project's secret variables with a long token-like value.
# The key shape of the Qloo hackathon key is not recorded here on purpose.
[[rules]]
id = "perkfit-secret-assignment"
description = "Assignment of a long token-like value to a PerkFit secret variable"
regex = '''(?i)(QLOO_API_KEY|ANTHROPIC_API_KEY|UPSTASH_REDIS_REST_TOKEN|PERKFIT_SECRET)["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9_\-\.=+/]{16,})'''
secretGroup = 2
keywords = ["qloo_api_key", "anthropic_api_key", "upstash_redis_rest_token", "perkfit_secret"]

[rules.allowlist]
regexes = ['''ci-dummy-[A-Za-z0-9\-]+''']

[allowlist]
description = "Dummy values used by CI and tests"
regexes = ['''ci-dummy-[A-Za-z0-9\-]+''']
