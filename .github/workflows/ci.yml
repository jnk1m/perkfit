name: ci

on: push

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PERKFIT_MODE: sample
      QLOO_API_KEY: ci-dummy-qloo-key-0000
      ANTHROPIC_API_KEY: ci-dummy-anthropic-key-0000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks action cannot scan a history whose first commit has no parent, so the binary runs directly.
      - name: gitleaks (full history)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml
          rm -f gitleaks gitleaks.tgz
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:repo -- --history
